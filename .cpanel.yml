---
# Deploy via cPanel Git Version Control ("Deploy HEAD Commit").
#
# O destino e o Document Root do dominio (public_html/ dentro do diretorio da
# conta). Usamos $HOME em vez do caminho literal para nao fixar o nome da conta.
#
# Estrutura FLAT: as pastas do funil (inicio/, home/, 2..10/, pagamento/,
# upsell/), os assets (js/, images/), o backend (php/) e os arquivos da raiz
# (index.html, fluxo.js, getCpf.php) vao DIRETO pra raiz do dominio. Local ==
# producao, entao os caminhos relativos (../fluxo.js, /php/api.php, ../js/...)
# valem igual nos dois.
#
# config.php (credenciais reais: Skale, CPF, UTMify + $OFFERS_CONFIG) NAO esta
# no git e este script nunca mexe nele - crie/edite manualmente uma vez no
# DEPLOYPATH, via File Manager, usando config.example.php como modelo.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/public_html/"
    - /bin/cp -r inicio home 2 3 4 5 6 7 8 9 10 pagamento upsell js images php "$DEPLOYPATH"
    - /bin/cp index.html fluxo.js getCpf.php "$DEPLOYPATH"
