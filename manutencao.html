<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manutenção</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#0f0f0f;color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;-webkit-font-smoothing:antialiased;
}
.box{max-width:420px;width:100%}
.icon{width:72px;height:72px;margin:0 auto 24px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center}
.icon svg{width:36px;height:36px;stroke:#f5b400;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:12px}
p{font-size:16px;line-height:1.6;color:#b3b3b3}
p strong{color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </div>
  <h1>Atenção, cliente da Lead Ads</h1>
  <p><strong>Estamos em manutenção.</strong><br>Voltamos em breve.</p>
</div>
</body>
</html>
